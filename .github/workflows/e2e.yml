name: E2E

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'LICENSE']   # docs-only changes don't need a build (saves AI quota)
  workflow_dispatch:
    inputs:
      update_screenshots:
        description: Commit the screenshots to docs/screenshots
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  e2e:
    name: Playwright against the full Docker stack
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}   # optional – without it the AI runs in demo mode
      AI_ENABLED: ${{ secrets.GEMINI_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Start database
        run: docker compose up -d --wait db

      - name: Build and start API + web
        run: docker compose up -d --build --no-deps --wait api web

      - name: Wait for the API
        run: |
          for i in $(seq 1 60); do curl -sf http://localhost:5080/health && break; sleep 2; done
          curl -sf http://localhost:4200/api/plans | jq length

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        working-directory: e2e
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        working-directory: e2e
        run: mkdir -p screenshots && npx playwright test

      - name: Upload screenshots & report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: |
            e2e/screenshots
            e2e/playwright-report

      - name: Commit screenshots
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.update_screenshots }}
        run: |
          mkdir -p docs/screenshots
          cp e2e/screenshots/*.png docs/screenshots/
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          git diff --cached --quiet || git commit -m "docs: update screenshots from E2E run"
          git push

      - name: AI errors (if any)
        if: always()
        run: docker compose logs api --no-color | grep -A30 -E "AI reply failed|fail:" | head -120 || true

      - name: Docker logs
        if: failure()
        run: docker compose logs api web --tail 200
