name: E2E

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      update_screenshots:
        description: Commit the screenshots to docs/screenshots
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  e2e:
    name: Playwright against the full Docker stack
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}   # optional – without it the AI runs in demo mode
      AI_ENABLED: ${{ secrets.GEMINI_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Models available to this AI key
        if: ${{ env.AI_ENABLED == 'true' }}
        run: |
          curl -s https://generativelanguage.googleapis.com/v1beta/openai/models -H "Authorization: Bearer $GEMINI_API_KEY" \
            | jq -r '.data[]?.id // .error' | sort | tr '\n' ' '
          echo
          for m in gemini-2.5-flash gemini-2.5-flash-lite gemini-3.5-flash gemini-3.1-flash-lite gemini-flash-latest; do
            code=$(curl -s -o /tmp/r.json -w '%{http_code}' https://generativelanguage.googleapis.com/v1beta/openai/chat/completions \
              -H "Authorization: Bearer $GEMINI_API_KEY" -H 'Content-Type: application/json' \
              -d "{\"model\":\"$m\",\"messages\":[{\"role\":\"user\",\"content\":\"Say OK\"}]}")
            echo "$m -> $code $(jq -c '.error.message // .choices[0].message.content' /tmp/r.json | cut -c1-120)"
          done

      - name: Start database
        run: docker compose up -d --wait db

      - name: Build and start API + web
        run: docker compose up -d --build --no-deps --wait api web

      - name: Wait for the API
        run: |
          for i in $(seq 1 60); do curl -sf http://localhost:5080/health && break; sleep 2; done
          curl -sf http://localhost:4200/api/plans | jq length

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        working-directory: e2e
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        working-directory: e2e
        run: mkdir -p screenshots && npx playwright test

      - name: Upload screenshots & report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: |
            e2e/screenshots
            e2e/playwright-report

      - name: Commit screenshots
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.update_screenshots }}
        run: |
          mkdir -p docs/screenshots
          cp e2e/screenshots/*.png docs/screenshots/
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          git diff --cached --quiet || git commit -m "docs: update screenshots from E2E run"
          git push

      - name: Docker logs
        if: failure()
        run: docker compose logs api web --tail 200
