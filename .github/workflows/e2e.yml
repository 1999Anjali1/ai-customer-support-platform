name: E2E

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  e2e:
    name: Playwright against the full Docker stack
    runs-on: ubuntu-latest
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}   # optional – without it the AI runs in demo mode
      EMBEDDINGS_ENABLED: "false"                 # skip the Ollama download in CI
    steps:
      - uses: actions/checkout@v4

      - name: Start database
        run: docker compose up -d --wait db

      - name: Build and start API + web
        run: docker compose up -d --build --no-deps --wait api web

      - name: Wait for the API
        run: |
          for i in $(seq 1 60); do curl -sf http://localhost:5080/health && break; sleep 2; done
          curl -sf http://localhost:4200/api/plans | jq length

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        working-directory: e2e
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        working-directory: e2e
        run: mkdir -p screenshots && npx playwright test

      - name: Upload screenshots & report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: |
            e2e/screenshots
            e2e/playwright-report

      - name: Docker logs
        if: failure()
        run: docker compose logs api web --tail 200
