# One command to run everything:  docker compose up --build
# Then open http://localhost:4200  (API docs: http://localhost:4200/scalar)

services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: smartsupport
      POSTGRES_PASSWORD: smartsupport
      POSTGRES_DB: smartsupport
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartsupport"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Local embedding model for semantic search (free, runs on CPU)
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama:/root/.ollama
    ports:
      - "11434:11434"

  # Downloads the embedding model once, then exits
  ollama-pull:
    image: ollama/ollama:latest
    depends_on:
      - ollama
    environment:
      OLLAMA_HOST: ollama:11434
    entrypoint: ["/bin/sh", "-c", "sleep 3 && ollama pull nomic-embed-text"]
    restart: "no"

  api:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
      ollama-pull:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: Host=db;Port=5432;Database=smartsupport;Username=smartsupport;Password=smartsupport
      Jwt__Key: ${JWT_KEY:-change-this-demo-key-0123456789-abcdefghijklmnop}
      AI__Chat__Endpoint: ${AI_CHAT_ENDPOINT:-https://api.groq.com/openai/v1}
      AI__Chat__ApiKey: ${GROQ_API_KEY:-}
      AI__Chat__Model: ${AI_CHAT_MODEL:-llama-3.3-70b-versatile}
      AI__Embeddings__Enabled: ${EMBEDDINGS_ENABLED:-true}
      AI__Embeddings__Endpoint: http://ollama:11434/v1
      AI__Embeddings__Model: nomic-embed-text
      Cors__Origins__0: http://localhost:4200
    ports:
      - "5080:8080"

  web:
    build: ./frontend
    depends_on:
      - api
    ports:
      - "4200:80"

volumes:
  pgdata:
  ollama:
